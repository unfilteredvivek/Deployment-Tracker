<!DOCTYPE html>
<html>
<head>
  <title>Deployment Dashboard</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      background: #00adb5;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background: #007b83;
    }
    #status {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>🚀 Deployment Dashboard</h1>

  <button onclick="deploy('latest')">Deploy Latest</button>
  <button onclick="deploy('v1')">Deploy v1</button>
  <button onclick="deploy('v2')">Deploy v2</button>

  <br><br>

  <button onclick="getVersion()">Check Current Version</button>
  <button onclick="getLogs()">Get Logs</button>
  <button onclick="loadHistory()">Deployment History</button>

<div id="history-section" style="margin-top: 30px;">
  <table id="history-table" style="width:100%; border-collapse: collapse; color: white;">
    <thead>
      <tr style="border-bottom: 1px solid #444;">
        <th style="padding: 8px; text-align: left;">Action</th>
        <th style="padding: 8px; text-align: left;">Version</th>
        <th style="padding: 8px; text-align: left;">Status</th>
        <th style="padding: 8px; text-align: left;">Duration (s)</th>
        <th style="padding: 8px; text-align: left;">Time</th>
      </tr>
    </thead>
    <tbody id="history-body"></tbody>
  </table>
</div>


  <div id="status"></div>

  <script>
    const API = window.location.origin; // your EC2

    async function deploy(version) {
      document.getElementById("status").innerText = "Deploying " + version + "...";

      try {
        const res = await fetch(`${API}/deploy/${version}`, {
          method: "POST"
        });

        const data = await res.text();
        document.getElementById("status").innerText = data;
      } catch (err) {
        document.getElementById("status").innerText = "Error ❌";
      }
    }

   async function getVersion() {
  try {
    const res = await fetch(`${API}/version`);
    const data = await res.text();
    document.getElementById("status").innerText = data + " (updated at " + new Date().toLocaleTimeString() + ")";
  } catch {
    document.getElementById("status").innerText = "API not reachable ❌";
  }
}

async function getLogs() {
  try {
    const res = await fetch(`${API}/logs`);
    const data = await res.text();
    document.getElementById("status").innerText = data;
  } catch {
    document.getElementById("status").innerText = "API not reachable ❌";
  }
}

 async function loadHistory() {
    try {
      const res = await fetch(`${API}/history`);
      const data = await res.json();
      const tbody = document.getElementById("history-body");
      tbody.innerHTML = data.map(row => `
        <tr style="border-bottom: 1px solid #333;">
          <td style="padding: 8px;">${row.action}</td>
          <td style="padding: 8px;">${row.version}</td>
          <td style="padding: 8px;">${row.success ? "✅" : "❌"}</td>
          <td style="padding: 8px;">${row.duration_seconds ?? "-"}</td>
          <td style="padding: 8px;">${new Date(row.created_at).toLocaleString()}</td>
        </tr>
      `).join("");
    } catch (err) {
      document.getElementById("history-body").innerHTML =
        `<tr><td colspan="5" style="padding:8px;">Failed to load history ❌</td></tr>`;
    }
  }

// auto refresh every 5 sec
setInterval(getVersion, 5000);

// load immediately
getVersion(); 
loadHistory(); 
    
  </script>

</body>
</html>
